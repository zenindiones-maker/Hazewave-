name: FYAHREAPER Remote MVP
on:
  push:
    branches:
      - work/fyahreaper-remote-mvp-v1
    paths:
      - 'apps/fyahreaper_remote/**'
      - '.github/workflows/fyahreaper-remote-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2.8,<3' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Execute tests
        env:
          PYTHONPATH: apps/fyahreaper_remote
        run: |
          python -m compileall -q apps/fyahreaper_remote
          python -m pytest -q apps/fyahreaper_remote/tests

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build unsigned debug APK
        working-directory: apps/fyahreaper_remote/android
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fyahreaper-remote-debug-apk
          path: apps/fyahreaper_remote/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
