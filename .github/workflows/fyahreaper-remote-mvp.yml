name: FYAHREAPER Remote MVP
on:
  push:
    branches:
      - work/fyahreaper-remote-mvp-v1
    paths:
      - 'apps/fyahreaper_remote/**'
      - '.github/workflows/fyahreaper-remote-mvp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        run: python -m pip install 'fastapi>=0.115,<1' 'pydantic>=2.8,<3' 'pytest>=8,<10' 'httpx>=0.27,<1'
      - name: Execute tests
        env:
          PYTHONPATH: apps/fyahreaper_remote
        run: |
          python -m compileall -q apps/fyahreaper_remote
          python -m pytest -q apps/fyahreaper_remote/tests

  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Build debug APKs (stable key; "prev" = same key, lower versionCode, for the upgrade test)
        working-directory: apps/fyahreaper_remote/android
        env:
          KS_B64: ${{ secrets.FYAH_DEBUG_KEYSTORE_B64 }}
          FYAH_KEYSTORE_PASSWORD: ${{ secrets.FYAH_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/fyah.p12"; export FYAH_KEYSTORE_FILE="$RUNNER_TEMP/fyah.p12"; else echo "::warning::no stable keystore secret; random debug key"; fi
          mkdir -p "$RUNNER_TEMP/out"
          FYAH_VERSION_OFFSET=-5 gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/app-debug-prev.apk"
          gradle --no-daemon :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/out/app-debug.apk"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$RUNNER_TEMP/out/app-debug.apk" > "$RUNNER_TEMP/out/badging.txt"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$RUNNER_TEMP/out/app-debug.apk" > "$RUNNER_TEMP/out/manifest-xmltree.txt"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/app-debug.apk" | grep -E "SHA-256|DN" > "$RUNNER_TEMP/out/signer.txt"
          "$BT/apksigner" verify --print-certs "$RUNNER_TEMP/out/app-debug-prev.apk" | grep -E "SHA-256" > "$RUNNER_TEMP/out/signer-prev.txt"
          cat "$RUNNER_TEMP/out/badging.txt" | head -3; cat "$RUNNER_TEMP/out/signer.txt"
          grep -q "launchable-activity: name='com.hazewave.fyahremote.MainActivity'" "$RUNNER_TEMP/out/badging.txt"
          grep -q "screenOrientation.*=12\|screenOrientation.*0xc\|screenOrientation(0x0101001e)=6\|screenOrientation(0x0101001e)=0x6" "$RUNNER_TEMP/out/manifest-xmltree.txt" || grep -n screenOrientation "$RUNNER_TEMP/out/manifest-xmltree.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: fyahreaper-remote-debug-apk
          path: |
            ${{ runner.temp }}/out/app-debug.apk
            ${{ runner.temp }}/out/app-debug-prev.apk
            ${{ runner.temp }}/out/badging.txt
            ${{ runner.temp }}/out/manifest-xmltree.txt
            ${{ runner.temp }}/out/signer.txt
            ${{ runner.temp }}/out/signer-prev.txt
          if-no-files-found: error

  android-emulator-e2e:
    needs: android-debug-apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fyahreaper-remote-debug-apk
          path: apps/fyahreaper_remote/android/app/build/outputs/apk/debug
      - name: Host tools (Xvfb, x11vnc, noVNC, websockify, Tk) + mock ReaHub deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb x11vnc novnc websockify python3-tk x11-utils ffmpeg fonts-dejavu-core
          python3 -m pip install --break-system-packages -q 'fastapi>=0.115,<1' 'pydantic>=2.8,<3' 'uvicorn>=0.30,<1' 'websockets>=12,<16'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator E2E (API 34, A15 geometry 1080x2340 @400dpi, rotation locked portrait)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -skin 1080x2340 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash apps/fyahreaper_remote/ci/emulator_e2e.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fyahreaper-emulator-e2e
          path: emu-out
