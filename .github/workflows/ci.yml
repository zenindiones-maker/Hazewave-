name: Hazewave CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Validate shell syntax
        run: |
          bash -n scripts/install_hazewave_termux_runtime.sh
          bash -n scripts/hazewave_termux_control.sh
          bash -n scripts/configure_hazewave_telegram.sh
          bash -n scripts/hazewave_telegram_control.sh
          bash -n scripts/install_hazewave_telegram_persistence.sh
          bash -n scripts/install_hazewave_freellmapi_termux.sh
          bash -n scripts/hazewave_freellmapi_control.sh
          bash -n scripts/install_hazewave_freellmapi_persistence.sh
          bash -n scripts/install_hazewave_9router_termux.sh
          bash -n scripts/hazewave_9router_control.sh
          bash -n scripts/hazewave_9router_free_probe.sh

      - name: Validate repository contracts
        run: python scripts/validate_repository_contracts.py

      - name: Run tests
        run: pytest
