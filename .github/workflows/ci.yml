name: Hazewave CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile package
        run: python -m compileall -q src

      - name: Validate shell syntax
        run: |
          bash -n scripts/install_hazewave_termux_runtime.sh
          bash -n scripts/hazewave_termux_control.sh
          bash -n scripts/configure_hazewave_telegram.sh
          bash -n scripts/hazewave_telegram_control.sh
          bash -n scripts/install_hazewave_telegram_persistence.sh
          bash -n scripts/install_hazewave_freellmapi_termux.sh
          bash -n scripts/hazewave_freellmapi_control.sh
          bash -n scripts/install_hazewave_freellmapi_persistence.sh
          bash -n scripts/install_hazewave_9router_termux.sh
          bash -n scripts/hazewave_9router_control.sh
          bash -n scripts/hazewave_9router_free_probe.sh
          bash -n scripts/codespaces/install-blender-pinned.sh
          bash -n scripts/codespaces/install-wave-runtime-pinned.sh
          bash -n scripts/codespaces/upgrade-professional-v2.sh
          bash -n scripts/codespaces/professional-doctor.sh
          bash -n scripts/codespaces/creative-execution-control.sh
          bash -n scripts/codespaces/hazewave-runtime-proof.sh
          bash -n scripts/codespaces/hazewave-termux-control.sh

      - name: Validate repository contracts
        run: python scripts/validate_repository_contracts.py

      - name: Run tests
        run: pytest

  source_truth:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout exact candidate head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify authenticated GitHub ref tree and protected deletions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m hazewave.source_truth_guard --github-pr
