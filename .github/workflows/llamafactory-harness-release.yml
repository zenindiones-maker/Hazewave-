name: LLaMA-Factory isolated release and Harness research qualification

on:
  pull_request:
    paths:
      - ".github/workflows/llamafactory-harness-release.yml"
      - "src/hazewave/llamafactory_install.py"
      - "src/hazewave/harness_connection_inventory.py"
      - "config/llamafactory-training-policy-v1.json"
      - "tests/test_llamafactory_isolated_install.py"
      - "tests/test_learning_dataset_bridge.py"
      - "src/hazewave/learning_dataset_bridge.py"
      - "scripts/codespaces/install-llamafactory-foss.sh"

permissions:
  contents: read

jobs:
  install-and-verify-published-distribution:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pinned policy and fail-closed Harness inventory
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install -e . pytest==8.4.2
          python -m pytest -q tests/test_llamafactory_isolated_install.py tests/test_learning_dataset_bridge.py
          python -m hazewave.harness inventory > "$RUNNER_TEMP/llama-harness-inventory.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          x=json.loads((Path(os.environ['RUNNER_TEMP'])/"llama-harness-inventory.json").read_text())
          y=x["learning_candidates"]["llamafactory"]
          assert y["training_status"]=="NOT_PROVEN"
          assert y["installation_status"]=="NOT_VERIFIED_ON_CODESPACE"
          assert y["harness_selected_provider"] is False
          assert x["summary"]["provider_mapped"]==10
          print("LLAMA_HARNESS_LEARNING_CANDIDATE=PASS_UNPROMOTED")
          PY
      - name: Obtain EXACT official PyPI wheel (no dependencies)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llama-wheel"
          python -m pip download --disable-pip-version-check --no-cache-dir \
            --no-deps --only-binary=:all: --dest "$RUNNER_TEMP/llama-wheel" \
            llamafactory==0.9.5
          wheel="$RUNNER_TEMP/llama-wheel/llamafactory-0.9.5-py3-none-any.whl"
          test -f "$wheel"
          printf '%s  %s\n' \
            10776e9b259798bf65f6c5343f6298f0302e92e9cd47472abe29eef69e286c6a \
            "$wheel" | sha256sum -c -
          PYTHONPATH=src python -m hazewave.llamafactory_install verify-wheel \
            --wheel "$wheel"
          echo "LLAMA_FACTORY_PYPI_PINNED_WHEEL_SHA256=PASS"
      - name: Install LLaMA-Factory 0.9.5 in disposable isolated venv
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/llama-isolated"
          "$RUNNER_TEMP/llama-isolated/bin/python" -m pip install \
            --disable-pip-version-check --no-index --no-deps \
            "$RUNNER_TEMP/llama-wheel/llamafactory-0.9.5-py3-none-any.whl"
          python -m hazewave.llamafactory_install doctor \
            --python "$RUNNER_TEMP/llama-isolated/bin/python" \
            > "$RUNNER_TEMP/llama-metadata-proof.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=json.loads((Path(os.environ['RUNNER_TEMP'])/"llama-metadata-proof.json").read_text())
          assert p["package_installed"] is True
          assert p["version"]=="0.9.5"
          assert p["full_dependency_stack_verified"] is False
          assert p["cli_runnable"] is False
          assert p["training_runnable"] is False
          assert p["harness_agent_connected"] is False
          assert p["production_approved"] is False
          print("LLAMA_FACTORY_RELEASE_INSTALLED_IN_CI=PASS_METADATA_ONLY")
          print("LLAMA_FACTORY_TRAINING_RUNTIME=NOT_PROVEN")
          print("LLAMA_FACTORY_EXISTING_CODESPACE=NOT_TESTED")
          PY

      - name: Audit real package import, installation RECORD and dependency status
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m hazewave.llamafactory_runtime_probe doctor \
            --python "$RUNNER_TEMP/llama-isolated/bin/python" \
            --wheel "$RUNNER_TEMP/llama-wheel/llamafactory-0.9.5-py3-none-any.whl" \
            --receipt-root "$RUNNER_TEMP/llama-real-import-evidence" \
            > "$RUNNER_TEMP/llama-import-report.jsonl"
          python - <<'PY'
          import json,os
          from pathlib import Path
          proof=next((Path(os.environ["RUNNER_TEMP"])/"llama-real-import-evidence").glob("*.json"))
          d=json.loads(proof.read_text())
          assert d["package_imported"] is True
          assert d["installed_files_hash_verified"] is True
          assert d["hash_files_verified"] >= 20
          assert d["version"] == "0.9.5"
          assert d["isolated_venv"] is True
          assert d["dependencies_satisfied"] is False
          assert d["cli_runnable"] is False
          assert d["model_training_ready"] is False
          assert d["production_approved"] is False
          assert proof.stat().st_mode & 0o077 == 0
          print("LLAMA_FACTORY_IMPORT_AND_RECORD_INTEGRITY=PASS")
          print("LLAMA_FACTORY_CLI_RUNTIMEREADY=FALSE")
          print("LLAMA_FACTORY_CI_ISOLATED_INSTALL=PASS")
          print("LLAMA_FACTORY_CODESPACE_INSTALL=NOT_TESTED")
          PY
      - name: Ensure installed-package modification invalidates attestation
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/llama-isolated/bin/python" - <<'PY'
          import importlib.metadata as m
          dist=m.distribution("llamafactory")
          target=next(dist.locate_file(p) for p in dist.files if str(p)=="llamafactory/cli.py")
          with open(target,"ab") as f:
              f.write(b"\\n# test-only integrity mutation\\n")
          PY
          if python -m hazewave.llamafactory_runtime_probe doctor \
            --python "$RUNNER_TEMP/llama-isolated/bin/python" \
            --wheel "$RUNNER_TEMP/llama-wheel/llamafactory-0.9.5-py3-none-any.whl" \
            > "$RUNNER_TEMP/llama-tamper-rejected.log" 2>&1; then
            echo "LLAMA_FACTORY_TAMPERED_PACKAGE=FALSE_PASS" >&2
            exit 20
          fi
          grep -F "ISOLATED_PACKAGE_IMPORT_OR_RECORD_FAILED" "$RUNNER_TEMP/llama-tamper-rejected.log"
          echo "LLAMA_FACTORY_TAMPERED_PACKAGE=REJECTED"
          echo "LLAMA_FACTORY_EXISTING_CODESPACE=NOT_TESTED"

  synthetic-evidence-to-alpaca-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install only open-source FFmpeg in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          command -v ffmpeg
          command -v cc
      - name: Generate actual original-binary inference and audio-video metric receipts
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m hazewave.native_behavior_synthesis \
            --state-root "$RUNNER_TEMP/native-synthetic" > "$RUNNER_TEMP/native-output.log"
          python -m hazewave.av_fidelity_oracle \
            --private-root "$RUNNER_TEMP/av-synthetic" > "$RUNNER_TEMP/av-output.log"
          native="$(find "$RUNNER_TEMP/native-synthetic" -maxdepth 1 -name 'synthesis-receipt-*.json' -print -quit)"
          av="$(find "$RUNNER_TEMP/av-synthetic" -maxdepth 1 -name 'av-receipt-*.json' -print -quit)"
          test -n "$native" && test -n "$av"
          python -m hazewave.learning_dataset_bridge \
            --native-receipt "$native" \
            --av-receipt "$av" \
            --output-root "$RUNNER_TEMP/synthetic-alpaca-preview"
          python - <<'PY'
          from pathlib import Path
          import json,os
          root=Path(os.environ["RUNNER_TEMP"])/"synthetic-alpaca-preview"
          items=json.loads((root/"hazewave_synthetic_research_demo.json").read_text())
          manifest=json.loads((root/"dataset_info.json").read_text())
          receipt=json.loads((root/"preview-receipt.json").read_text())
          assert len(items)==3
          assert set(items[0])=={"instruction","input","output"}
          assert manifest["hazewave_synthetic_research_demo"]["formatting"]=="alpaca"
          assert receipt["training_admitted"] is False
          assert receipt["owner_dataset_grant"]=="NOT_PROVEN"
          assert receipt["production_approved"] is False
          assert all(p.stat().st_mode & 0o077 == 0 for p in root.iterdir())
          print("HAZE_NATIVE_EVIDENCE_DATASET_BRIDGE=PASS_SYNTHETIC_ONLY")
          print("HAZE_WAVE_AUDIO_VIDEO_DATASET_BRIDGE=PASS_SYNTHETIC_ONLY")
          print("LLAMAFACTORY_REAL_TRAINING=NOT_ATTEMPTED")
          print("LLAMAFACTORY_EXISTING_CODESPACE=NOT_TESTED")
          PY
