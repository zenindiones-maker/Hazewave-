name: WAVE Site CI

on:
  push:
    branches:
      - "work/wave-hazewave-site-v1"
      - "work/wave-cosmic-interference-v1"
      - "work/wave-illustrated-interference-v2"
      - "work/wave-living-universe-p0-v1"
      - "work/wave-articulated-rig-v3a"
      - "work/wave-v4-*"
    paths:
      - "apps/hazewave-site/**"
      - "docs/wave/WAVE_SITE_DEPENDENCY_DECISIONS_V1.md"
      - "docs/wave/WAVE_DESIGN_FRONTIER_2026.md"
      - "docs/wave/WAVE_HAZEWAVE_WORLD_BIBLE_V1.md"
      - "docs/wave/WAVE_HAZEWAVE_INTERACTIVE_MUSIC_SITE_V1.md"
      - "docs/DOCUMENTATION_REGISTRY_V2.json"
      - "scripts/ci/wave_candidate_delivery.py"
      - "tests/test_wave_candidate_delivery.py"
      - ".github/workflows/wave-site-ci.yml"
  pull_request:
    paths:
      - "apps/hazewave-site/**"
      - "docs/wave/WAVE_SITE_DEPENDENCY_DECISIONS_V1.md"
      - "docs/wave/WAVE_DESIGN_FRONTIER_2026.md"
      - "docs/wave/WAVE_HAZEWAVE_WORLD_BIBLE_V1.md"
      - "docs/wave/WAVE_HAZEWAVE_INTERACTIVE_MUSIC_SITE_V1.md"
      - "docs/DOCUMENTATION_REGISTRY_V2.json"
      - "scripts/ci/wave_candidate_delivery.py"
      - "tests/test_wave_candidate_delivery.py"
      - ".github/workflows/wave-site-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install repository dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python package
        run: python -m compileall -q src

      - name: Validate repository contracts
        run: python scripts/validate_repository_contracts.py

      - name: Run repository tests
        run: pytest

  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/hazewave-site
    steps:
      - name: Checkout immutable reviewed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate A15 runtime proof script
        run: bash -n scripts/a15-runtime-proof.sh

      - name: V4 source JavaScript syntax (no owner media)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f experiments/travessia-v4/travessia.js ]; then
            node --check experiments/travessia-v4/travessia.js
            echo "WAVE_V4_JS_STATIC_SYNTAX=PASS"
          fi

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Static build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm test -- --workers=1 --project=chromium-desktop --project=chromium-mobile

      - name: Preserve static runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hazewave-site-static-dist
          path: apps/hazewave-site/dist
          if-no-files-found: error
          retention-days: 30

      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazewave-site-package-lock
          path: apps/hazewave-site/package-lock.json
          if-no-files-found: error

      - name: Preserve visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazewave-site-visual-proof
          path: apps/hazewave-site/test-results
          if-no-files-found: warn

  wave-v4-source-candidate-delivery:
    name: Auto-CD · reviewed WAVE V4 source only
    # Fail-closed: depends on BOTH Python governance and real site/browser CI.
    # No asset or executable may be promoted after a skipped/failed job.
    needs: [repository-contracts, build-and-browser-test]
    if: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'work/wave-v4-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source and build deterministic staging artifact
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/hazewave-v4-source-cd"
          python scripts/ci/wave_candidate_delivery.py package \
            --repo-root . \
            --out "$RUNNER_TEMP/hazewave-v4-source-cd/wave-v4-source-candidate.zip" \
            --expected-sha "$CANDIDATE_SHA"
          python scripts/ci/wave_candidate_delivery.py verify \
            --package "$RUNNER_TEMP/hazewave-v4-source-cd/wave-v4-source-candidate.zip" \
            --expected-sha "$CANDIDATE_SHA"
          {
            echo "### WAVE V4 · automatic candidate delivery"
            echo ""
            echo "- **Exact reviewed HEAD:** \`$CANDIDATE_SHA\`"
            echo "- **Required CI:** repository contracts + browser/build passed"
            echo "- **Delivered:** SHA-bound source-only archive and signed-by-hash receipt"
            echo "- **Owner media in artifact:** NO"
            echo "- **Deployment/merge:** NOT ATTEMPTED"
            echo "- **Production and artistic approval:** PENDING"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deliver immutable source-only candidate for owner review
        uses: actions/upload-artifact@v4
        with:
          name: wave-v4-source-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/hazewave-v4-source-cd/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false
