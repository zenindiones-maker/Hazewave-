name: WAVE Site CI

on:
  push:
    branches:
      - "work/wave-hazewave-site-v1"
      - "work/wave-cosmic-interference-v1"
      - "work/wave-illustrated-interference-v2"
    paths:
      - "apps/hazewave-site/**"
      - "docs/wave/WAVE_SITE_DEPENDENCY_DECISIONS_V1.md"
      - "docs/wave/WAVE_DESIGN_FRONTIER_2026.md"
      - "docs/wave/WAVE_HAZEWAVE_WORLD_BIBLE_V1.md"
      - "docs/wave/WAVE_HAZEWAVE_INTERACTIVE_MUSIC_SITE_V1.md"
      - "docs/DOCUMENTATION_REGISTRY_V2.json"
      - ".github/workflows/wave-site-ci.yml"
  pull_request:
    paths:
      - "apps/hazewave-site/**"
      - "docs/wave/WAVE_SITE_DEPENDENCY_DECISIONS_V1.md"
      - "docs/wave/WAVE_DESIGN_FRONTIER_2026.md"
      - "docs/wave/WAVE_HAZEWAVE_WORLD_BIBLE_V1.md"
      - "docs/wave/WAVE_HAZEWAVE_INTERACTIVE_MUSIC_SITE_V1.md"
      - "docs/DOCUMENTATION_REGISTRY_V2.json"
      - ".github/workflows/wave-site-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install repository dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python package
        run: python -m compileall -q src

      - name: Validate repository contracts
        run: python scripts/validate_repository_contracts.py

      - name: Run repository tests
        run: pytest

  build-and-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/hazewave-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve deterministic lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate A15 runtime proof script
        run: bash -n scripts/a15-runtime-proof.sh

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Static build
        run: npm run build

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm test -- --workers=1 --project=chromium-desktop --project=chromium-mobile

      - name: Preserve static runtime
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hazewave-site-static-dist
          path: apps/hazewave-site/dist
          if-no-files-found: error
          retention-days: 30

      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazewave-site-package-lock
          path: apps/hazewave-site/package-lock.json
          if-no-files-found: error

      - name: Preserve visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hazewave-site-visual-proof
          path: apps/hazewave-site/test-results
          if-no-files-found: warn
