name: WAVE Site CI

on:
  push:
    branches:
      - "work/wave-hazewave-site-v1"
      - "work/wave-cosmic-interference-v1"
      - "work/wave-illustrated-interference-v2"
      - "work/wave-living-universe-p0-v1"
      - "work/wave-articulated-rig-v3a"
    paths:
      - "apps/hazewave-site/**"
      - "docs/wave/WAVE_SITE_DEPENDENCY_DECISIONS_V1.md"
      - "docs/wave/WAVE_DESIGN_FRONTIER_2026.md"
      - "docs/wave/WAVE_HAZEWAVE_WORLD_BIBLE_V1.md"
      - "docs/wave/WAVE_HAZEWAVE_INTERACTIVE_MUSIC_SITE_V1.md"
      - "docs/DOCUMENTATION_REGISTRY_V2.json"
      - "scripts/ci/wave_candidate_delivery.py"
      - "tests/test_wave_candidate_delivery.py"
      - ".github/workflows/wave-site-ci.yml"
  # V4 branches run on PR synchronization: avoid duplicate push + PR runners.
  pull_request:
    paths:
      - "apps/hazewave-site/**"
      - "docs/wave/WAVE_SITE_DEPENDENCY_DECISIONS_V1.md"
      - "docs/wave/WAVE_DESIGN_FRONTIER_2026.md"
      - "docs/wave/WAVE_HAZEWAVE_WORLD_BIBLE_V1.md"
      - "docs/wave/WAVE_HAZEWAVE_INTERACTIVE_MUSIC_SITE_V1.md"
      - "docs/DOCUMENTATION_REGISTRY_V2.json"
      - "scripts/ci/wave_candidate_delivery.py"
      - "tests/test_wave_candidate_delivery.py"
      - ".github/workflows/wave-site-ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wave-artcraft-e2e:
    name: Seven Craft CLIs + manifesto obrigatório + navegador
    uses: ./.github/workflows/wave-artcraft-seven-integrated-proof.yml
    permissions:
      contents: read

  repository-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.14"

      - name: Install repository dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python package
        run: python -m compileall -q src

      - name: Validate repository contracts
        run: python scripts/validate_repository_contracts.py

      - name: Run repository tests
        run: pytest

  build-and-browser-test:
    needs: [wave-artcraft-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/hazewave-site
    steps:
      - name: Checkout immutable reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Download SAME RUN fully verified seven-Craft integration manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: hazewave-seven-artcraft-integrated-lab-${{ github.run_id }}
          path: ${{ runner.temp }}/wave-site-seven-artcraft

      - name: Pin exact SHA, run and external bundle for EVERY site build
        shell: bash
        run: |
          set -euo pipefail
          echo "HAZEWAVE_ARTCRAFT_BUNDLE=$RUNNER_TEMP/wave-site-seven-artcraft" >> "$GITHUB_ENV"
          echo "HAZEWAVE_ARTCRAFT_RUN_ID=${{ github.run_id }}" >> "$GITHUB_ENV"
          echo "HAZEWAVE_ARTCRAFT_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
          node scripts/artcraft-build-gate.mjs verify \
            --bundle "$RUNNER_TEMP/wave-site-seven-artcraft" \
            --run-id "${{ github.run_id }}" \
            --head-sha "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: One-command clean install, manifest-gated build and real Chromium E2E
        run: bash ../../scripts/verify.sh

      - name: Preserve static runtime
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hazewave-site-static-dist
          path: apps/hazewave-site/dist
          if-no-files-found: error
          retention-days: 30

      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hazewave-site-package-lock
          path: apps/hazewave-site/package-lock.json
          if-no-files-found: error

      - name: Preserve hardening log, Lighthouse report and three screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hazewave-hardening-verification
          path: verification/
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve visual proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hazewave-site-visual-proof
          path: apps/hazewave-site/test-results
          if-no-files-found: warn

      - name: Preserve new Site 01 real scroll-as-brush review build (no private paintings)
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hazewave-site01-seven-act-ink-review-${{ github.run_id }}
          path: verification/site01-review/
          retention-days: 30
          if-no-files-found: error

  wave-v4-source-candidate-delivery:
    name: Auto-CD · reviewed WAVE source only
    # Fail-closed: depends on BOTH Python governance and real site/browser CI.
    # No asset or executable may be promoted after a skipped/failed job.
    needs: [repository-contracts, build-and-browser-test]
    if: ${{ startsWith(github.event.pull_request.head.ref || github.ref_name, 'work/wave-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate SHA (no persisted credentials)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact source and build deterministic staging artifact
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/hazewave-source-cd"
          python scripts/ci/wave_candidate_delivery.py package \
            --repo-root . \
            --out "$RUNNER_TEMP/hazewave-source-cd/wave-source-candidate.zip" \
            --expected-sha "$CANDIDATE_SHA"
          python scripts/ci/wave_candidate_delivery.py verify \
            --package "$RUNNER_TEMP/hazewave-source-cd/wave-source-candidate.zip" \
            --expected-sha "$CANDIDATE_SHA"
          {
            echo "### WAVE · automatic candidate delivery"
            echo ""
            echo "- **Exact reviewed HEAD:** \`$CANDIDATE_SHA\`"
            echo "- **Required CI:** repository contracts + browser/build passed"
            echo "- **Delivered:** SHA-bound source-only archive and signed-by-hash receipt"
            echo "- **Owner media in artifact:** NO"
            echo "- **Deployment/merge:** NOT ATTEMPTED"
            echo "- **Production and artistic approval:** PENDING"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deliver immutable source-only candidate for owner review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wave-source-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/hazewave-source-cd/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

  wave-v4-pipeline-report:
    name: Auto-CD · visible verdict, including blocked runs
    needs: [repository-contracts, build-and-browser-test, wave-v4-source-candidate-delivery]
    if: ${{ always() && startsWith(github.event.pull_request.head.ref || github.ref_name, 'work/wave-v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Write pipeline verdict to GitHub run summary
        shell: bash
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CONTRACTS: ${{ needs.repository-contracts.result }}
          WEB_BROWSER: ${{ needs.build-and-browser-test.result }}
          SOURCE_CD: ${{ needs.wave-v4-source-candidate-delivery.result }}
        run: |
          set -euo pipefail
          {
            echo "### HAZEWAVE WAVE · unattended CI/CD gate"
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| Source and governance tests | $CONTRACTS |"
            echo "| Astro build and actual browser tests | $WEB_BROWSER |"
            echo "| Exact-HEAD source-only staged delivery | $SOURCE_CD |"
            echo
            echo "Reviewed commit: $SHA"
            echo
            if [[ "$CONTRACTS" == "success" && "$WEB_BROWSER" == "success" && "$SOURCE_CD" == "success" ]]; then
              echo "**DEVELOPMENT CANDIDATE READY FOR HUMAN REVIEW**"
            else
              echo "**BLOCKED; NO CANDIDATE DELIVERED FOR THIS COMMIT**"
              echo "Inspect the failed job and its logs. Do not automatically rerun or bypass."
            fi
            echo
            echo "Production=BLOCKED; Human artistic approval=PENDING; Codespace/A15=UNTOUCHED"
          } >> "$GITHUB_STEP_SUMMARY"
