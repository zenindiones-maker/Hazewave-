name: WAVE Owned Scroll Forensic Proof

on:
  pull_request:
    paths:
      - ".github/workflows/wave-scroll-owned-proof.yml"
      - "src/hazewave/wave_scroll_evidence.py"
      - "src/hazewave/wave_scroll_learning.py"
      - "scripts/research/scroll-owned-fixture.cjs"
      - "tests/fixtures/wave-scroll-owned.html"
      - "tests/fixtures/wave-scroll-js-owned/**"
      - "tests/test_wave_scroll_evidence.py"
      - "tests/test_wave_scroll_learning.py"

permissions:
  contents: read

jobs:
  browser-owned-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test fail-closed evidence validator
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python -m pip install -e ".[dev]"
          python -m pytest -q tests/test_wave_scroll_evidence.py tests/test_wave_scroll_learning.py

      - name: Install pinned browser test tool in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          npm_config_ignore_scripts=true npm install --prefix "$RUNNER_TEMP/wave-pw" \
            --no-audit --no-fund --ignore-scripts playwright@1.63.0
          node -e 'const p=require(process.argv[1]);if(p.name!=="playwright"||p.version!=="1.63.0")process.exit(20)' \
            "$RUNNER_TEMP/wave-pw/node_modules/playwright/package.json"
          "$RUNNER_TEMP/wave-pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "WAVE_BROWSER_PIN=PLAYWRIGHT_1_63_0"

      - name: REA6 analyzes the exact JS used by the browser
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          npm_config_ignore_scripts=true npm install --prefix "$RUNNER_TEMP/wave-rea6" \
            --no-audit --no-fund --ignore-scripts rea-agents@6.0.0
          node -e 'const p=require(process.argv[1]);if(p.name!=="rea-agents"||p.version!=="6.0.0")process.exit(20)' \
            "$RUNNER_TEMP/wave-rea6/node_modules/rea-agents/package.json"
          folder="$GITHUB_WORKSPACE/tests/fixtures/wave-scroll-js-owned"
          before="$(sha256sum "$folder/main.js" | cut -d' ' -f1)"
          "$RUNNER_TEMP/wave-rea6/node_modules/.bin/rea" \
            analyze-javascript-application "$folder" --json \
            > "$RUNNER_TEMP/wave-rea-static-evidence.json"
          python -m hazewave.rea6_provider_conformance validate-js-fixture \
            --fixture "$folder" --evidence "$RUNNER_TEMP/wave-rea-static-evidence.json"
          test "$before" = "$(sha256sum "$folder/main.js" | cut -d' ' -f1)"
          test -z "$(git status --porcelain)"
          echo "WAVE_REA6_STATIC_SAME_BROWSER_SOURCE=PASS"
          echo "WAVE_REA6_DIRECT_AGENT_SESSION=NOT_TESTED"

      - name: Produce eight actual scroll screenshots per viewport
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/wave-pw/node_modules
        run: |
          set -euo pipefail
          node scripts/research/scroll-owned-fixture.cjs \
            "$RUNNER_TEMP/wave-scroll-owned" \
            "$GITHUB_WORKSPACE/tests/fixtures/wave-scroll-owned.html"

      - name: Validate PNG pixels and physically causal reversible drawing
        shell: bash
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          for viewport in mobile393 mobile360 desktop; do
            root="$RUNNER_TEMP/wave-scroll-owned/$viewport"
            python -m hazewave.wave_scroll_evidence \
              --input "$root/browser-capture.json" \
              --capture-root "$root" \
              --repo-sha "$(git rev-parse HEAD)" \
              > "$RUNNER_TEMP/wave-$viewport-validation.jsonl"
            grep -F "WAVE_SCROLL_OWNED_BROWSER_EVIDENCE=PASS" \
              "$RUNNER_TEMP/wave-$viewport-validation.jsonl"
            grep -F '"status":"BOUNDED_REPRODUCED_BEHAVIOR"' \
              "$RUNNER_TEMP/wave-$viewport-validation.jsonl"
            python -c 'import json,hashlib,sys;from pathlib import Path;d=json.loads(Path(sys.argv[1]).read_text());assert d["app_source_sha256"]==hashlib.sha256(Path(sys.argv[2]).read_bytes()).hexdigest()' \
              "$root/browser-capture.json" "$GITHUB_WORKSPACE/tests/fixtures/wave-scroll-js-owned/main.js"
          done
          python -m hazewave.wave_scroll_learning \
            --capture "$RUNNER_TEMP/wave-scroll-owned/mobile393/browser-capture.json" \
            --capture-root "$RUNNER_TEMP/wave-scroll-owned/mobile393" \
            --rea-evidence "$RUNNER_TEMP/wave-rea-static-evidence.json" \
            --repo-sha "$(git rev-parse HEAD)" \
            --state-root "$RUNNER_TEMP/wave-private-knowledge"
          echo "WAVE_SCROLL_REAL_BROWSER=PASS_3_VIEWPORTS"
          echo "WAVE_SCROLL_FRAME_COUNT=24"
          echo "WAVE_SCROLL_EXTERNAL_SITES=NOT_TESTED"
          echo "WAVE_REA6_STATIC_SAME_BROWSER_SOURCE=PASS"
          echo "WAVE_REA6_GUIDED_RECONSTRUCTION=NOT_PROVEN"
          echo "WAVE_CODESPACE_RUNTIME=NOT_TESTED"
          echo "WAVE_AGENT_MCP_CONNECTED=NOT_TESTED"
          echo "WAVE_PRODUCTION_APPROVED=FALSE"
