name: hazewave-site-v1 tests
on:
  push: { paths: ['site/**','.github/workflows/hazewave-site-v1*.yml'] }
  pull_request: { paths: ['site/**'] }
  workflow_dispatch:
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 20 }
      - name: dist
        run: mkdir -p ../_dist && cp -r index.html style.css ink.js media ../_dist/
      - name: HTML validation
        run: npx --yes html-validate@8 index.html
      - name: Link check
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with: { args: "--no-progress site/index.html", fail: true }
      - name: Lighthouse CI (mobile budget)
        run: npx --yes @lhci/cli@0.14.x autorun --config=lighthouserc.json
      - name: Playwright mobile
        run: npm i && npx playwright install --with-deps chromium && mkdir -p shots && npx playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: hazewave-site-screenshots, path: site/shots }
