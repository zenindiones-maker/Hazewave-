[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hazewave"
version = "0.2.0"
description = "Local generative music and neural audio processing tools for Hazewave."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
separation = [
  "demucs>=4.0.1,<5",
  "torch>=2.2,<3",
]
dev = [
  "pytest>=8,<9",
  "jsonschema==4.17.3",
  "pyrsistent>=0.20,<0.22",
]

[project.scripts]
hazewave = "hazewave.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
